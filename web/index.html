<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 40px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 18px; }
        table { width: 92%; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #3498db; color: white; text-transform: uppercase; font-size: 13px; }
        tr:hover { background-color: #f8f9fa; }
        .btn { background: #2ecc71; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: bold; margin-bottom: 20px; border: none; cursor: pointer; }
        .btn:hover { background: #27ae60; }
        .center-div { text-align: center; }

        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .status-badge.pending { background-color: #ffeaa7; color: #b7791f; }
        .status-badge.completed { background-color: #d4edda; color: #1e7e34; }

        /* Action Buttons: Soft light appearance with clear contrast */
        .action-btn {
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        .complete-btn {
            background-color: #f4fbf7;
            color: #1e7e34;
            border: 1px solid #b7e4c7;
        }
        .complete-btn:hover {
            background-color: #e6f7ed;
            color: #155724;
            border-color: #8fd3a8;
        }
        .pending-btn {
            background-color: #fffdf7;
            color: #9c6200;
            border: 1px solid #f5d89a;
        }
        .pending-btn:hover {
            background-color: #fff6e0;
            color: #7a4b00;
            border-color: #ecc472;
        }
        .spin-btn {
            background-color: #f9f5ff;
            color: #6f2dbd;
            border: 1px solid #d8bbfa;
        }
        .spin-btn:hover {
            background-color: #efe5ff;
            color: #561d99;
            border-color: #c197f5;
        }
        .delete-btn {
            background-color: #fff8f8;
            color: #b52b27;
            border: 1px solid #f3b7b5;
        }
        .delete-btn:hover {
            background-color: #ffecec;
            color: #8f1d1a;
            border-color: #e89491;
        }
        .overdue { color: #d63031; font-weight: bold; }

        /* Spin Wheel Modal */
        #wheel-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; z-index: 999; }
        .wheel-box { background: #ffffff; padding: 24px 28px; border-radius: 16px; text-align: center; width: 350px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
        .wheel-box h3 { margin: 0 0 14px 0; color: #2c3e50; font-size: 20px; }

        .wheel-wrapper { position: relative; width: 270px; height: 286px; margin: 0 auto; }
        .pointer-arrow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 28px solid #e74c3c;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
            z-index: 10;
        }
        #wheelCanvas { display: block; margin: 14px auto 0 auto; }

        .wheel-controls { margin-top: 14px; display: flex; justify-content: center; gap: 10px; }
        #spin-btn-action { background: #8e44ad; color: #ffffff; border: none; padding: 10px 22px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background-color 0.2s ease; }
        #spin-btn-action:hover:not(:disabled) { background: #732d91; }
        #spin-btn-action:disabled { opacity: 0.55; cursor: not-allowed; }

        #reward-result {
            margin-top: 14px;
            font-weight: bold;
            font-size: 14px;
            color: #2d3436;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #win-badge-canvas { display: none; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>📋 Task Tracker</h1>
    <div class="center-div">
        <a href="add-task.html" class="btn">➕ Create New Task</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Task Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Deadline</th>
                <th>Available Actions</th>
            </tr>
        </thead>
        <tbody id="task-table-body"></tbody>
    </table>

    <div id="wheel-modal">
        <div class="wheel-box">
            <h3>🎡 Snack Reward Wheel</h3>
            <div class="wheel-wrapper">
                <div class="pointer-arrow" title="Winning Pointer"></div>
                <canvas id="wheelCanvas" width="270" height="270"></canvas>
            </div>
            <div class="wheel-controls">
                <button id="spin-btn-action" onclick="spinWheel()">Spin Now!</button>
                <button class="action-btn delete-btn" onclick="closeWheel()">Close</button>
            </div>
            <div id="reward-result">
                <canvas id="win-badge-canvas" width="28" height="28"></canvas>
                <span id="reward-text">Spin the wheel to win a snack!</span>
            </div>
        </div>
    </div>

    <script>
        let activeTaskId = null;
        let currentAngle = 0;
        const snacks = [
            { name: "Chocolate", color: "#ff595e", accent: "#6d3b2e", type: "choc" },
            { name: "Almonds", color: "#ffca3a", accent: "#a4683b", type: "almond" },
            { name: "Dates", color: "#8ac926", accent: "#5c2c16", type: "dates" },
            { name: "Muesli", color: "#1982c4", accent: "#d99b52", type: "muesli" },
            { name: "Cookies", color: "#6a4c93", accent: "#c68b59", type: "cookie" },
            { name: "Treat", color: "#ff70a6", accent: "#ff477e", type: "treat" }
        ];
        const TWO_PI = Math.PI * 2;

        function normalizeAngle(angle) {
            return ((angle % TWO_PI) + TWO_PI) % TWO_PI;
        }

        function getWinningIndex(angle) {
            const arc = TWO_PI / snacks.length;
            const pointerAngle = normalizeAngle(-Math.PI / 2);
            const wheelStart = normalizeAngle(angle);
            const localAngle = normalizeAngle(pointerAngle - wheelStart);
            return Math.floor(localAngle / arc) % snacks.length;
        }

        function drawSnackIcon(ctx, type, x, y, r) {
            ctx.save();
            ctx.translate(x, y);
            if (type === "choc") {
                ctx.fillStyle = "#5a2d1b";
                ctx.fillRect(-r * 0.7, -r * 0.9, r * 1.4, r * 1.8);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1.2;
                ctx.strokeRect(-r * 0.5, -r * 0.65, r, r * 1.3);
            } else if (type === "almond") {
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 0.65, r * 0.95, 0.25, 0, TWO_PI);
                ctx.fillStyle = "#c68642";
                ctx.fill();
            } else if (type === "dates") {
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 0.6, r * 0.95, -0.2, 0, TWO_PI);
                ctx.fillStyle = "#4a2311";
                ctx.fill();
            } else if (type === "muesli") {
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.85, 0, TWO_PI);
                ctx.fillStyle = "#f4d08a";
                ctx.fill();
                ctx.fillStyle = "#8b4513";
                ctx.beginPath();
                ctx.arc(-r * 0.25, -r * 0.2, r * 0.18, 0, TWO_PI);
                ctx.arc(r * 0.25, r * 0.2, r * 0.18, 0, TWO_PI);
                ctx.fill();
            } else if (type === "cookie") {
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.85, 0, TWO_PI);
                ctx.fillStyle = "#d99b52";
                ctx.fill();
                ctx.fillStyle = "#3b2314";
                ctx.beginPath();
                ctx.arc(-r * 0.25, -r * 0.15, r * 0.14, 0, TWO_PI);
                ctx.arc(r * 0.2, -r * 0.25, r * 0.14, 0, TWO_PI);
                ctx.arc(r * 0.1, r * 0.25, r * 0.14, 0, TWO_PI);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.8, 0, TWO_PI);
                ctx.fillStyle = "#ffe66d";
                ctx.fill();
            }
            ctx.restore();
        }

        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 124;
            const arc = TWO_PI / snacks.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Outer rim
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 6, 0, TWO_PI);
            ctx.fillStyle = "#2c3e50";
            ctx.fill();

            // Snack slices
            snacks.forEach((snack, i) => {
                const startAngle = currentAngle + i * arc;
                const endAngle = startAngle + arc;
                const midAngle = startAngle + arc / 2;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = snack.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Label fitted inside slice
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(midAngle);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px 'Segoe UI', Arial, sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.45)";
                ctx.shadowBlur = 3;
                ctx.fillText(snack.name, radius - 14, 0);
                ctx.restore();

                // Small snack icon inside mid-radius
                const iconX = cx + Math.cos(midAngle) * 52;
                const iconY = cy + Math.sin(midAngle) * 52;
                drawSnackIcon(ctx, snack.type, iconX, iconY, 8);
            });

            // Center cap
            ctx.beginPath();
            ctx.arc(cx, cy, 20, 0, TWO_PI);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#2c3e50";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 7, 0, TWO_PI);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();
        }

        function renderWinBadge(snack) {
            const badge = document.getElementById("win-badge-canvas");
            const bctx = badge.getContext("2d");
            bctx.clearRect(0, 0, badge.width, badge.height);
            bctx.fillStyle = snack.color;
            bctx.beginPath();
            bctx.arc(14, 14, 13, 0, TWO_PI);
            bctx.fill();
            drawSnackIcon(bctx, snack.type, 14, 14, 8);
            badge.style.display = "inline-block";
        }

        function openWheel(taskId) {
            activeTaskId = taskId;
            document.getElementById("win-badge-canvas").style.display = "none";
            document.getElementById("reward-text").innerText = "Spin the wheel to win a snack!";
            document.getElementById("spin-btn-action").disabled = false;
            document.getElementById("wheel-modal").style.display = "flex";
            drawWheel();
        }

        function closeWheel() {
            document.getElementById("wheel-modal").style.display = "none";
            loadLiveTasks();
        }

        function spinWheel() {
            const spinBtn = document.getElementById("spin-btn-action");
            spinBtn.disabled = true;
            document.getElementById("win-badge-canvas").style.display = "none";
            document.getElementById("reward-text").innerText = "Spinning...";

            const extraSpin = (Math.random() * 4 + 5) * TWO_PI;
            const startAngle = currentAngle;
            const targetAngle = startAngle + extraSpin;
            const startTime = performance.now();
            const duration = 2200;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    const winIdx = getWinningIndex(currentAngle);
                    const wonSnack = snacks[winIdx];
                    fetch('/claim-reward?id=' + activeTaskId)
                        .then(() => {
                            renderWinBadge(wonSnack);
                            document.getElementById("reward-text").innerText = "You won: " + wonSnack.name + "!";
                        })
                        .catch(() => {
                            renderWinBadge(wonSnack);
                            document.getElementById("reward-text").innerText = "You won: " + wonSnack.name + "!";
                        });
                }
            }
            requestAnimationFrame(animate);
        }

        function loadLiveTasks() {
            fetch('/get-tasks?t=' + new Date().getTime())
                .then(response => response.text())
                .then(data => {
                    document.getElementById('task-table-body').innerHTML = data;
                })
                .catch(err => console.log("Error loading tasks: ", err));
        }
        loadLiveTasks();
    </script>
</body>
</html>
